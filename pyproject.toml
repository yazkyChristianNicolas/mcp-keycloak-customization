[project]
name = "keycloak-customization-mcp"
version = "0.1.0"
description = "MCP server (stdio) con la documentación de personalización de UI de Keycloak"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
keycloak-customization-mcp = "keycloak_customization_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keycloak_customization_mcp"]
